<script src="../site/assets/engine.js"></script><script src="../site/assets/engine3d.js"></script><script src="../site/assets/tecnicas/sankaku-jime.js"></script>
<script>const F=Judo.pose3(Judo.techs['sankaku-jime'],6.6),r=v=>v.map(x=>x.toFixed(2)).join(',');

document.getElementById('o').textContent=s;</script></body></html>
