<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="o"></pre>
<script src="../site/assets/catalog.js"></script><script src="../site/assets/engine.js"></script><script src="../site/assets/engine3d.js"></script>
<script>const Q=new URLSearchParams(location.hash.slice(1));document.write('<script src="../site/assets/tecnicas/'+(Q.get('id')||'sankaku-jime')+'.js"><\/script>');</script>
<script>const def=Judo.techs[Q.get('id')||'sankaku-jime'],r=v=>v.map(x=>x.toFixed(2)).join(',');let s='';
for(const t of (Q.get('t')||'6.6').split(',').map(Number)){const F=Judo.pose3(def,t);s+='t='+t+'\n';
for(const w of ['tori','uke']){const o=F[w];s+=w+' hip '+r(o.hip)+' neck '+r(o.neck)+' head '+r(o.head)+' f '+r(o.f)+' r '+r(o.r)+'\n';
for(const k of ['legR','legL','armR','armL'])s+='  '+k+' root '+r(o[k].root)+' E '+r(o[k].E)+' H '+r(o[k].H)+'\n';}}
document.getElementById('o').textContent=s;</script></body></html>
