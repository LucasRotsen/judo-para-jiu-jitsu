name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Imagem oficial já traz browsers e dependências: evita o apt, que travava o job.
    container: mcr.microsoft.com/playwright:v1.48.2-jammy
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - name: Páginas geradas estão em dia com tools/build.py
        run: python3 tools/build.py && git diff --exit-code -- site
      - run: npm test
