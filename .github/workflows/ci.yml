name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Imagem oficial já traz browsers e dependências: evita o apt, que travava o job.
    container: mcr.microsoft.com/playwright:v1.48.2-jammy
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - name: Páginas geradas estão em dia com tools/build.py
        run: python3 tools/build.py && git diff --exit-code -- site
      - name: Poses físicas assadas estão em dia com as técnicas e com fisica.js
        run: node tools/assar.js --check
      - name: Contratos das técnicas (parte certa do corpo, lado certo, sem queda de cabeça)
        run: node tools/contratos.js --assado --portao
      - run: npm test
      - name: Movimento físico (nada atravessa, nada salta) dentro do orçamento
        run: node tools/diagnostico.js --portao
